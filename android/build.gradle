buildscript {
  ext {
    buildToolsVersion = "34.0.0"
    minSdkVersion = 23
    compileSdkVersion = 34
    targetSdkVersion = 34
    ndkVersion = "26.1.10909125"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.3.2")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23")
  }
}

// Exponer el catálogo de versiones como expoLibs (usado en app/build.gradle)
def libsExt = extensions.findByName("libs")
if (libsExt != null) {
  ext["expoLibs"] = libsExt
}


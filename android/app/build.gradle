plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
}

// Cargar el script de autolinking de Expo para el contexto de build.gradle
def expoAutolinkImplPath = ""
try {
  expoAutolinkImplPath = [
    "node", "--print",
    "require.resolve('expo-modules-autolinking/scripts/android/autolinking_implementation.gradle')"
  ].execute(null, rootDir).text.trim()
} catch (ignore) {
}
if (!expoAutolinkImplPath) {
  expoAutolinkImplPath = new File(rootDir, "../node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle").getPath()
}
def expoAutolinkImplFile = new File(expoAutolinkImplPath)
ext.expoModulesAutolinkingApplied = expoAutolinkImplFile.isFile()
if (expoAutolinkImplFile.isFile()) {
  apply from: expoAutolinkImplFile
} else {
  logger.lifecycle("[app/build.gradle] Script de autolinking de Expo no encontrado; continuando sin aplicarlo en esta ejecución.")
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
// Fallback para Hermes si no está definido por propiedades
def hermesEnabled = (findProperty('hermesEnabled') ?: true)

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    // Establecemos explícito para evitar "compileSdkVersion is not specified"
    compileSdk 34

    namespace 'com.agustinwaller.myappf'
    defaultConfig {
        applicationId 'com.agustinwaller.myappf'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",")
    for (i in 0..<options.size()) options[i] = options[i].trim()
    options -= ""
    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Hermes / JSC
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Expo modules autolinking: añade expo y expo-modules-core al classpath de compilación
    // (usa el script cargado abajo)
    if (project.ext.expoModulesAutolinkingApplied) {
        project.ext.addExpoModulesDependencies(project.dependencies, project)
    } else {
        logger.lifecycle("[app/build.gradle] addExpoModulesDependencies no disponible; omitiendo en esta ejecución.")
    }
}
